name: Verify exact Saren Office v5 archive (isolated)

on:
  push:
    branches:
      - saren-v5-linux-verify-20261010

permissions:
  contents: read

jobs:
  verify-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned transport branch
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct approved archive without source substitution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saren-v5"
          cp recovery/v5-transport/ScribeOffice_v5_payload_manifest.json "$RUNNER_TEMP/saren-v5/"
          cp recovery/v5-transport/ScribeOffice_v5_payload_part_*_of_22.txt "$RUNNER_TEMP/saren-v5/"
          cp recovery/v5-transport/restore_ScribeOffice_v5_from_parts.py.txt "$RUNNER_TEMP/saren-v5/restore_ScribeOffice_v5_from_parts.py"
          cd "$RUNNER_TEMP/saren-v5"
          python3 restore_ScribeOffice_v5_from_parts.py
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          p = pathlib.Path("ScribeOffice_recovery_candidate_v5_20261009.zip")
          manifest = json.loads(pathlib.Path("ScribeOffice_v5_payload_manifest.json").read_text())
          assert p.stat().st_size == manifest["raw_bytes"]
          assert hashlib.sha256(p.read_bytes()).hexdigest() == manifest["sha256"]
          with zipfile.ZipFile(p) as z:
              names = [x for x in z.namelist() if not x.endswith("/")]
              assert len(names) == 104 and len(names) == len(set(names))
              root = pathlib.Path("ScribeOffice_v5_exact").resolve()
              for name in names:
                  target = (root / name).resolve()
                  assert target.is_relative_to(root), name
                  assert target.read_bytes() == z.read(name), name
          print("VERIFIED: 104/104 extracted files, ZIP and SHA-256")
          PY

      - name: Static boundary verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          node verify-recovery-boundaries.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          npm install --no-audit --no-fund

      - name: TypeScript lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          npm run lint

      - name: Unchanged production build
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          npm run build

      - name: Check approved source file bytes again
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5"
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          archive = pathlib.Path("ScribeOffice_recovery_candidate_v5_20261009.zip")
          root = pathlib.Path("ScribeOffice_v5_exact")
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              mismatches = [n for n in names if not (root/n).is_file() or (root/n).read_bytes() != z.read(n)]
          print("SOURCE CORRESPONDENCE:", len(names)-len(mismatches), "/", len(names))
          if mismatches:
              print("MISMATCHES:", mismatches)
              raise SystemExit(1)
          print("ARCHIVE SHA-256:", hashlib.sha256(archive.read_bytes()).hexdigest())
          PY

      - name: Inspect Firestore test entrypoints (read only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          echo "=== Available test files ==="
          find . -maxdepth 2 -type f \( -iname '*firestore*' -o -iname '*rule*' -o -iname '*lifecycle*' -o -name 'firebase.json' \) -not -path './node_modules/*' | sort | head -80
          echo "=== package scripts ==="
          node -e 'console.log(JSON.stringify(require("./package.json").scripts,null,2))'
          for f in test-rules-emulator.mjs verify-saren-lifecycle.mjs; do
            if [ -f "$f" ]; then
              echo "=== $f (first 100 lines) ==="
              sed -n '1,100p' "$f"
            fi
          done
          if [ -f firebase.json ]; then
            echo "=== firebase.json ==="
            cat firebase.json
          fi

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Execute isolated Firestore rules and lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          npm install --no-save --no-package-lock --no-audit --no-fund @firebase/rules-unit-testing
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-saren-recovery-rules --config firebase.json 'node test-rules-emulator.mjs'
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-saren-recovery-lifecycle --config firebase.json 'node verify-saren-lifecycle.mjs'

      - name: Diagnose lifecycle create preconditions (read-only)
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          echo '=== Firestore rules, targeted ==='
          nl -ba firestore.rules | sed -n '215,260p'
          echo '=== Lifecycle fixture, targeted ==='
          nl -ba verify-saren-lifecycle.mjs | sed -n '1,110p'
          echo '=== Matched rules test successful fixtures ==='
          grep -n -C 6 'runtime.*create\|revision 1\|runtimeRecord' test-rules-emulator.mjs | head -95 || true

      - name: Diagnose runtime schema predicate without changing source
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          echo "=== isValidRuntimeState definition ==="
          grep -n -A 42 -B 4 'function isValidRuntimeState' firestore.rules
          echo "=== ownsWorld definition ==="
          grep -n -A 14 -B 4 'function ownsWorld' firestore.rules
          echo "=== successful runtime creation assertions ==="
          grep -n -A 12 -B 8 'runtime.*create\|revision 1' test-rules-emulator.mjs | tail -110

      - name: Inspect reconstructed v5 server signing paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("server.ts")
          s=p.read_text()
          lines=s.splitlines()
          patterns=[r"createHmac",r"timingSafeEqual",r"verifySigned",r"signature",r"runtime"]
          for pattern in patterns:
              hits=[i+1 for i,line in enumerate(lines) if re.search(pattern,line,re.I)]
              print(f"{pattern}: count={len(hits)} lines={hits[:35]}")
          print("integration files:",[str(p) for p in Path(".").glob("*test*.mjs") if "node_modules" not in str(p)])
          PY

      - name: Inspect signed runtime server handlers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          sed -n '335,565p' server.ts

      - name: Exercise extracted approved server HMAC implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          node --input-type=commonjs <<'JS'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const crypto=require('node:crypto');
          const ts=require('typescript');
          const assert=require('node:assert/strict');
          const source=fs.readFileSync('server.ts','utf8');
          function extract(name) {
            const start=source.indexOf('function '+name+'(');
            assert.ok(start>=0, name+' must be present');
            const finish=source.indexOf('\n}', start);
            assert.ok(finish>start, name+' missing closing brace');
            return source.slice(start,finish+2);
          }
          const body=extract('requireSarenRuntimeSigningKey')+'\n'+extract('signSarenRuntimeRecord')+'\n'+'globalThis.sign=signSarenRuntimeRecord;';
          const js=ts.transpileModule(body,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
          const processMock={env:{SAREN_RUNTIME_SIGNING_KEY:'unit-test-key-only-0123456789-abcdef-0123456789'}};
          const scope={crypto,process:processMock};
          vm.runInNewContext(js,scope);
          const sign=scope.sign;
          const fields=['test-world','test-owner',1,'2026-10-10T00:00:00.000Z','{"schemaVersion":"saren-handoff-v3"}'];
          const good=sign(...fields);
          assert.match(good,/^[a-f0-9]{64}$/);
          assert.equal(sign(...fields),good);
          for(let i=0;i<fields.length;i++){
            const changed=[...fields];changed[i]=i===2?2:changed[i]+'-changed';
            assert.notEqual(sign(...changed),good,'field '+i+' tamper must change signature');
          }
          processMock.env.SAREN_RUNTIME_SIGNING_KEY='different-test-key-0123456789-abcdef-0123456789';
          assert.notEqual(sign(...fields),good,'wrong key must change signature');
          processMock.env.SAREN_RUNTIME_SIGNING_KEY='short';
          assert.throws(()=>sign(...fields),/at least 32 characters/);
          assert.ok(source.includes('if (signature !== expectedSignature)'),'server must reject wrong signature');
          console.log('PASS: real v5 HMAC functions; deterministic, field tampering, wrong key, short key, reject branch');
          JS

      - name: Integration-test real v5 loader against isolated Firestore emulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          cat > /tmp/saren-hmac-integration-test.cjs <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),crypto=require('node:crypto'),assert=require('node:assert/strict'),ts=require(process.cwd()+'/node_modules/typescript');
          const src=fs.readFileSync('server.ts','utf8');
          function extract(name){
            const start=src.indexOf('function '+name+'(');
            assert.ok(start>=0,'function missing: '+name);
            let i=src.indexOf('{',start),depth=0,inString=false,quote='';
            for(let j=i;j<src.length;j++){
              const c=src[j]; if(inString){if(c==='\\'){j++;continue;}if(c===quote)inString=false;continue;}
              if(c==='"'||c==="'"||c==='\x60'){inString=true;quote=c;continue;}
              if(c==='{')depth++;if(c==='}'&&!--depth)return src.slice(start,j+1);
            }
            throw Error('unclosed function '+name);
          }
          const names=['requireSarenRuntimeSigningKey','signSarenRuntimeRecord','loadPersistedSarenHandoff'];
          // Use TS AST to extract complete functions rather than text searching (types and nested braces).
          const sf=ts.createSourceFile('server.ts',src,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
          const nodes=sf.statements.filter(n=>ts.isFunctionDeclaration(n)&&names.includes(n.name?.text));
          assert.equal(nodes.length,3);
          const tsCode=nodes.map(n=>n.getText(sf)).join('\n')+'\nglobalThis.__target={signSarenRuntimeRecord,loadPersistedSarenHandoff};';
          const js=ts.transpileModule(tsCode,{compilerOptions:{target:ts.ScriptTarget.ES2022}}).outputText;
          const key='ci-only-integration-signing-key-0123456789';
          const env={SAREN_RUNTIME_SIGNING_KEY:key,FIRESTORE_EMULATOR_HOST:process.env.FIRESTORE_EMULATOR_HOST};
          const ctx={crypto,process:{env},fetch:global.fetch,console,readJsonFile:async()=>({projectId:'demo-saren-integration',firestoreDatabaseId:'(default)',apiKey:'test-only'}),isValidId:s=>/^[a-zA-Z0-9_-]{1,128}$/.test(s),isValidSarenHandoff:obj=>obj?.schemaVersion==='saren-handoff-v3'};
          vm.runInNewContext(js,ctx);
          const {signSarenRuntimeRecord:sign,loadPersistedSarenHandoff:load}=ctx.__target;
          const host='http://'+env.FIRESTORE_EMULATOR_HOST;
          const world='integration_world',owner='integration_owner';
          const path='/v1/projects/demo-saren-integration/databases/(default)/documents/worlds/'+world+'/runtime/saren-signed-v3';
          const base={agent:'Saren Nur Tsaiyunk',worldId:world,ownerId:owner,revision:1,updatedAt:new Date().toISOString(),handoffJson:JSON.stringify({schemaVersion:'saren-handoff-v3',sessionId:'integration'})};
          async function put(values){
            const fields={};for(const [k,v] of Object.entries(values))fields[k]=typeof v==='number'?{integerValue:String(v)}:{stringValue:v};
            const res=await fetch(host+path,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer owner'},body:JSON.stringify({fields})});
            assert.ok(res.ok,'emulator test fixture write '+res.status+' '+(await res.text()));
          }
          async function check(label,mutate,expected){
            const rec={...base,signature:sign(base.worldId,base.ownerId,base.revision,base.updatedAt,base.handoffJson)};mutate(rec);
            await put(rec);
            const result=await load(world,owner,'owner');
            assert.equal(result.status,expected,label+': '+JSON.stringify({status:result.status,error:result.error}));
            console.log('PASS',label,result.status);
          }
          (async()=>{
            await check('valid signed record',()=>{},'restored');
            await check('tampered handoffJson',r=>r.handoffJson+=' ', 'malformed');
            await check('wrong signature',r=>r.signature='f'.repeat(64),'malformed');
            await check('owner scope mismatch',r=>r.ownerId='other_owner','mismatched_scope');
            await check('world scope mismatch',r=>r.worldId='other_world','mismatched_scope');
            await check('signed but invalid handoff schema',r=>{r.handoffJson=JSON.stringify({schemaVersion:'unknown'});r.signature=sign(r.worldId,r.ownerId,r.revision,r.updatedAt,r.handoffJson)},'malformed');
            console.log('SERVER LOADER / FIRESTORE EMULATOR INTEGRATION PASSED');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-saren-integration --config firebase.json 'node /tmp/saren-hmac-integration-test.cjs'

      - name: Authenticated persistence and recall (isolated emulators)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          python3 - <<'PY'
          import json
          p=json.load(open('firebase.json'))
          p.setdefault('emulators',{})['auth']={'host':'127.0.0.1','port':9099}
          open('/tmp/saren-auth-emulators.json','w').write(json.dumps(p))
          PY
          cat > /tmp/saren-auth-persist.cjs <<'JS'
          const fs=require('fs'),ts=require(process.cwd()+'/node_modules/typescript'),vm=require('vm'),crypto=require('crypto'),assert=require('assert').strict;
          const text=fs.readFileSync('server.ts','utf8'),sf=ts.createSourceFile('server.ts',text,ts.ScriptTarget.Latest,true);
          const names=['requireSarenRuntimeSigningKey','signSarenRuntimeRecord','persistSarenHandoff','loadPersistedSarenHandoff'];
          const nodes=sf.statements.filter(n=>ts.isFunctionDeclaration(n)&&names.includes(n.name?.text));
          assert.equal(nodes.length,4,'real v5 server functions present');
          const js=ts.transpileModule(nodes.map(n=>n.getText(sf)).join('\n')+'\nglobalThis.api={persistSarenHandoff,loadPersistedSarenHandoff};',{compilerOptions:{target:ts.ScriptTarget.ES2022}}).outputText;
          const project='demo-saren-auth-persist',world='integration_world',key='ci-only-auth-test-signing-key-012345678901';
          const authBase='http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1';
          async function auth(endpoint,data){const r=await fetch(authBase+endpoint+'?key=test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const dataText=await r.text();assert.ok(r.ok,'auth '+r.status+': '+dataText);return JSON.parse(dataText);}
          async function write(url,data,token){const r=await fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});assert.ok(r.ok,'world setup '+r.status+': '+await r.text());}
          (async()=>{
            const u=await auth('/accounts:signUp',{email:'owner@example.test',password:'password-for-ci-12345',returnSecureToken:true});
            const uid=u.localId,token=u.idToken;
            await auth('/accounts:update',{idToken:token,emailVerified:true});
            const login=await auth('/accounts:signInWithPassword',{email:'owner@example.test',password:'password-for-ci-12345',returnSecureToken:true});
            const ownerToken=login.idToken;
            const env={SAREN_RUNTIME_SIGNING_KEY:key,FIRESTORE_EMULATOR_HOST:'127.0.0.1:8085'};
            const config={projectId:project,firestoreDatabaseId:'(default)',apiKey:'test'};
            const sandbox={crypto,console,process:{env},fetch,readJsonFile:async()=>config,isValidId:x=>/^[a-zA-Z0-9_-]{1,128}$/.test(x),isValidSarenHandoff:x=>x?.schemaVersion==='saren-handoff-v3'};
            vm.runInNewContext(js,sandbox);
            const {persistSarenHandoff:persist,loadPersistedSarenHandoff:load}=sandbox.api;
            const url='http://127.0.0.1:8085/v1/projects/'+project+'/databases/(default)/documents/worlds/'+world;
            const fields={worldName:{stringValue:'Isolated test world'},genre:{stringValue:'test'},description:{stringValue:'test'},highConcept:{stringValue:'test'},ownerId:{stringValue:uid},createdAt:{stringValue:new Date().toISOString()}};
            await write(url,{fields},ownerToken);
            const handoff={schemaVersion:'saren-handoff-v3',sessionId:'isolated-auth-test',trackingScope:'server_observed_only'};
            const first=await persist(handoff,world,uid,ownerToken);
            assert.equal(first.persisted,true,'revision 1: '+JSON.stringify(first));
            assert.equal(first.revision,1);
            const restored=await load(world,uid,ownerToken);
            assert.equal(restored.status,'restored','recall: '+JSON.stringify({status:restored.status,error:restored.error}));
            const second=await persist(handoff,world,uid,ownerToken);
            assert.equal(second.persisted,true,'revision 2: '+JSON.stringify(second));
            assert.equal(second.revision,2);
            const again=await load(world,uid,ownerToken);
            assert.equal(again.status,'restored');
            const stranger=await auth('/accounts:signUp',{email:'attacker@example.test',password:'password-for-ci-12345',returnSecureToken:true});
            const unauthorized=await load(world,stranger.localId,stranger.idToken);
            assert.notEqual(unauthorized.status,'restored','cross-user recall denied');
            console.log('PASS authenticated persistence revisions 1 and 2, signed recall, wrong-owner isolation');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-saren-auth-persist --config /tmp/saren-auth-emulators.json 'node /tmp/saren-auth-persist.cjs'

      - name: Inspect Notion route access guards
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          sed -n '1,45p' server.ts
          sed -n '1160,1290p' server.ts
          grep -n -E '401|unauthorized|Unauthorized|auth|API_KEY|middleware' server.ts | tail -70 || true

      - name: Verify Notion integration remains fail-closed in containment v3
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const server=fs.readFileSync('server.ts','utf8');
          const boundaries=fs.readFileSync('verify-recovery-boundaries.mjs','utf8');
          assert.match(server,/WRITE UNAVAILABLE: Notion mutations are disabled in Containment v3/);
          assert.match(server,/NOTION_AUTHORIZED_UIDS/);
          assert.ok(boundaries.includes('Notion principal ACL'));
          console.log('PASS: Notion writes intentionally disabled; auth principal ACL enforced by recovered v5');
          JS
          NOTION_API_KEY=mock-test-key NODE_ENV=production node dist/server.cjs >/tmp/saren-notion-guard.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            code=$(curl --silent --output /tmp/saren-notion-probe.json --write-out '%{http_code}' http://127.0.0.1:3000/api/notion/status || true)
            if [ "$code" = 401 ]; then break; fi
            sleep 1
          done
          test "$code" = 401
          code=$(curl --silent --output /tmp/saren-export-probe.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/api/notion/export -H 'content-type: application/json' -d '{"parentPageId":"mock-parent","title":"Unauthorized Probe","content":"none"}')
          test "$code" = 401
          echo "PASS Notion unauthenticated status and export denied HTTP 401; no external call or document created"

      - name: Verify workspace document creation boundaries in Firestore
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          cat > /tmp/saren-document-create-test.cjs <<'JS'
          const {initializeTestEnvironment,assertFails,assertSucceeds}=require(process.cwd()+'/node_modules/@firebase/rules-unit-testing');
          const {doc,setDoc,getDoc,updateDoc}=require(process.cwd()+'/node_modules/firebase/firestore');
          const fs=require('fs'),assert=require('assert').strict;
          (async()=>{
            const env=await initializeTestEnvironment({projectId:'demo-saren-doc-create',firestore:{rules:fs.readFileSync('firestore.rules','utf8'),host:'127.0.0.1',port:8085}});
            try {
              const owner='doc_owner',world='doc_world';
              await env.withSecurityRulesDisabled(async ctx=>{
                await setDoc(doc(ctx.firestore(),'worlds',world),{worldName:'Document Test',genre:'test',description:'test',highConcept:'test',ownerId:owner,createdAt:new Date().toISOString()});
              });
              const db=env.authenticatedContext(owner,{email_verified:true}).firestore();
              const other=env.authenticatedContext('other_owner',{email_verified:true}).firestore();
              const reference=doc(db,'worlds',world,'documents','draft_test_1');
              const base={title:'Isolated Test Draft',category:'Other',content:'# Test\nDraft body',version:1,tags:[],ownerId:owner,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),provenance:{origin:'user',evidenceStatus:'user_record',note:'test fixture'}};
              await assertSucceeds(setDoc(reference,base)); console.log('PASS user authored workspace document created');
              assert.equal((await getDoc(reference)).data().title,base.title);console.log('PASS user document readback');
              await assertFails(setDoc(doc(other,'worlds',world,'documents','foreign_draft'),{...base,ownerId:'other_owner'}));console.log('PASS cross-owner document creation denied');
              await assertFails(getDoc(doc(other,'worlds',world,'documents','draft_test_1')));console.log('PASS cross-owner document read denied');
              await assertFails(setDoc(doc(db,'worlds',world,'documents','generated_draft'),{...base,provenance:{origin:'generated',evidenceStatus:'generated_draft',note:'generated content'}}));console.log('PASS generated draft client-forged provenance denied');
              console.log('WORKSPACE DOCUMENT CREATION MATRIX PASSED');
            }finally{await env.cleanup()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-saren-doc-create --config firebase.json 'node /tmp/saren-document-create-test.cjs'

      - name: Trace document creation UI to persistence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/saren-v5/ScribeOffice_v5_exact"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const code=fs.readFileSync('src/App.tsx','utf8').split('\n');
          const terms=['addDoc(', 'setDoc(', 'createDocument','handleCreate','saveDocument','Create Document','New Document','generate-lore','draft-update','documents'];
          let matches=0;
          for(let i=0;i<code.length;i++){
            if(terms.some(t=>code[i].includes(t))){
              console.log(String(i+1).padStart(4,' '),code[i].slice(0,220));
              matches++;
            }
          }
          assert.ok(matches>5,'expected frontend document references');
          console.log('TRACE: '+matches+' frontend references');
          JS

      - name: Inspect exact document save handler and rules
        shell: bash
        run: |
          set -euo pipefail
